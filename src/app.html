<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#4f46e5" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
		<script>
			// Night mode and the look before the first paint, by the rules of `theme` in
			// settings.svelte.ts and seasonalLook() in theme.ts.
			{
				let night = null;
				let look = null;
				try {
					night = JSON.parse(localStorage.getItem('vp:night'));
					look = JSON.parse(localStorage.getItem('vp:look'));
				} catch {
					// No storage: the defaults apply, as they do in the app.
				}
				if (night ?? matchMedia('(prefers-color-scheme: dark)').matches) {
					document.documentElement.classList.add('dark');
				}
				if (look !== 'classic' && look !== 'halloween') {
					const now = new Date();
					const october = now.getMonth() === 9;
					look = october || (now.getMonth() === 10 && now.getDate() === 1) ? 'halloween' : '';
				}
				if (look === 'halloween') document.documentElement.dataset.theme = 'halloween';
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
