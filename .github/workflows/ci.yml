name: CI

on:
  push:
    branches: [main, dev]
  # Every pull request, also one stacked on another feature branch.
  pull_request:
  # By hand: on main this also deploys once the tests pass (Cloudflare even without CLOUDFLARE_DEPLOY).
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR branch cancels the run for the previous push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The test jobs run in parallel; each one fails fast instead of hanging for hours.
# The deploy jobs run only on main, and only after every test job has passed.
jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Installs the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The merge commit of a pull request and its base, to see what the pull request changes.
          fetch-depth: 2
      # Installs the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
        env:
          # Pull requests solve again only the collection puzzles they change (bank.test.ts);
          # pushes to main check the whole collection.
          BANK_TEST_SINCE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false

  e2e:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Chromium and its system libraries come preinstalled, which saves the slow apt install.
    # Keep the tag in step with @playwright/test in pnpm-lock.yaml; Playwright fails with a
    # clear message when they differ.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Browser tests
            script: test:e2e
          - name: Server tests (sync between devices, settings)
            script: test:server
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      # Installs the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.script }}

  # Deploys reuse pages.yml and cloudflare.yml. Only the newest commit may go live: a newer run
  # cancels a deploy still in progress, and each deploy checks again right before publishing.
  pages:
    name: Deploy to GitHub Pages
    needs: [lint, unit, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  cloudflare:
    name: Deploy to Cloudflare Workers
    needs: [lint, unit, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    concurrency:
      group: cloudflare-deploy
      cancel-in-progress: true
    uses: ./.github/workflows/cloudflare.yml
    secrets: inherit
