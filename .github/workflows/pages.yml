name: Deploy to GitHub Pages

# Static build without server features. Enable Pages in the repository settings
# with "GitHub Actions" as the source.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only the newest commit may go live: a newer push cancels a run still in progress, and the
# deploy job checks again right before publishing (e.g. when an old run is re-run).
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job publishes, so only it gets write access to Pages.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: latest
        name: Check that this is still the newest commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq .sha)
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not deploying ${{ github.sha }}: ${{ github.ref_name }} is now at $head."
          fi
      - id: deployment
        if: steps.latest.outputs.latest == 'true'
        uses: actions/deploy-pages@v4
