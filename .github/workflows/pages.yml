name: Deploy to GitHub Pages

# Static build without server features. Enable Pages in the repository settings
# with "GitHub Actions" as the source.
# Started only by CI (ci.yml) on main, after every test has passed; CI also holds the
# concurrency group, so a newer run cancels a deploy still in progress.
on:
  workflow_call:

permissions:
  contents: read

# The deploy job checks right before publishing that this is still the newest commit
# (e.g. when an old run is re-run).

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          # No server here: the app never asks for one (see README, "Connection defaults").
          HAS_SERVER: 'false'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only the deploy job publishes, so only it gets write access to Pages.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: latest
        name: Check that this is still the newest commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq .sha)
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not deploying ${{ github.sha }}: ${{ github.ref_name }} is now at $head."
          fi
      - id: deployment
        if: steps.latest.outputs.latest == 'true'
        uses: actions/deploy-pages@v4
