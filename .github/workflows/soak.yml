name: Soak test

# A long session of play on desktop and phone, every night and by hand. It fails when memory,
# DOM nodes, listeners, timers, observers, workers or storage keep growing (see e2e-load/).
# A failure opens an issue (or comments on the open one), so it does not go unnoticed.
on:
  schedule:
    - cron: '17 2 * * *'
  # A short run on pull requests that change the soak test itself.
  pull_request:
    paths: ['e2e-load/**', 'playwright.load.config.ts', '.github/workflows/soak.yml']
  workflow_dispatch:
    inputs:
      actions:
        description: Actions per session
        default: '2000'
      seed:
        description: Random seed (empty for a new one; a failure names the seed to repeat it)
        default: ''

permissions:
  contents: read

concurrency:
  group: soak-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  soak:
    name: Soak test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Same image as the browser tests in ci.yml; keep the tag in step with @playwright/test.
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      SOAK_ACTIONS: ${{ inputs.actions || (github.event_name == 'pull_request' && '400') || '2000' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # A new seed every night covers new paths; the seed is printed so a failure can be repeated.
      - name: Pick the seed
        run: echo "SOAK_SEED=${{ inputs.seed || github.run_id }}" >> "$GITHUB_ENV"
      - run: echo "Soak test with seed $SOAK_SEED and $SOAK_ACTIONS actions per session"
      - run: npm run test:soak
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-results
          path: test-results/
          retention-days: 30

  report:
    name: Report a failure
    needs: soak
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly soak test failed"
          body="The soak test failed on $(date -u +%F) (seed ${{ github.run_id }}): $RUN"
          open=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
