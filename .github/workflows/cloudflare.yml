name: Deploy to Cloudflare Workers

# Full build with server features (saves, sync, leaderboards). Started only by CI (ci.yml) on
# main, after every test has passed, and deploys only when the repository variable
# CLOUDFLARE_DEPLOY is "true" or CI was started by hand. CI also holds the concurrency group,
# so a newer run cancels a deploy still in progress.
# Needs the secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_D1_DATABASE_ID.
on:
  workflow_call:

permissions:
  contents: read

# The job checks right before deploying that this is still the newest commit
# (e.g. when an old run is re-run).

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.CLOUDFLARE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      # Installs the pnpm version from the packageManager field in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Set D1 database ID
        run: sed -i "s/00000000-0000-0000-0000-000000000000/${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}/" wrangler.jsonc
      # Build first, so the check below happens right before anything goes live.
      - run: pnpm build
      - id: latest
        name: Check that this is still the newest commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/commits/${{ github.ref_name }}" --jq .sha)
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Not deploying ${{ github.sha }}: ${{ github.ref_name }} is now at $head."
          fi
      # The same as `pnpm cf:deploy` after its build.
      - if: steps.latest.outputs.latest == 'true'
        run: pnpm exec wrangler d1 migrations apply DB --remote && pnpm exec wrangler deploy
